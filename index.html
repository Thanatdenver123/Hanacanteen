<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>บันทึกทำความสะอาด</title>
    <link href="https://fonts.googleapis.com/css2?family=Prompt:wght@300;400;500;600&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Prompt', sans-serif; background-color: #f3f4f6; display: flex; justify-content: center; padding: 20px; color: #1f2937; margin: 0; }
        .form-container { background: white; padding: 30px; border-radius: 12px; box-shadow: 0 4px 6px rgba(0,0,0,0.05); width: 100%; max-width: 500px; }
        h2 { text-align: center; color: #2563eb; margin-bottom: 25px; font-weight: 600; }
        .form-group { margin-bottom: 18px; }
        label { display: block; margin-bottom: 8px; font-weight: 500; font-size: 15px; color: #4b5563; }
        select, input[type="text"], input[type="date"], input[type="file"] { width: 100%; padding: 12px; border: 1px solid #d1d5db; border-radius: 8px; font-family: 'Prompt'; font-size: 15px; box-sizing: border-box; background-color: #f9fafb; transition: 0.2s; }
        select:focus, input:focus { outline: none; border-color: #2563eb; ring: 2px; background-color: #fff; }
        button { width: 100%; padding: 14px; background: #2563eb; color: white; border: none; border-radius: 8px; font-family: 'Prompt'; font-size: 16px; font-weight: 600; cursor: pointer; margin-top: 15px; transition: 0.2s; }
        button:hover { background: #1d4ed8; }
        button:disabled { background: #9ca3af; cursor: not-allowed; }
        .inspector-link { display: block; text-align: center; margin-top: 25px; color: #6b7280; text-decoration: none; font-size: 14px; font-weight: 500; }
        .inspector-link:hover { color: #1f2937; }
    </style>
</head>
<body>

<div class="form-container">
    <h2>บันทึกทำความสะอาดบ่อน้ำเสีย</h2>
    
    <form id="myForm">
        <div class="form-group">
            <label>1. ร้านอาหาร</label>
            <select id="shop" required>
                <option value="">-- เลือกร้านค้า --</option>
                <option value="ร้านที่ 1">ร้านที่ 1</option>
                <option value="ร้านที่ 2">ร้านที่ 2</option>
                <option value="ร้านที่ 3">ร้านที่ 3</option>
                <option value="ร้านที่ 4">ร้านที่ 4</option>
                <option value="ร้านที่ 5">ร้านที่ 5</option>
            </select>
        </div>

        <div class="form-group">
            <label>2. รอบการทำความสะอาด</label>
            <select id="shift" required>
                <option value="">-- เลือกรอบ --</option>
                <option value="รอบเช้า (ก่อน 11:00 น.)">รอบเช้า (ก่อน 11:00 น.)</option>
                <option value="รอบบ่าย (ก่อน 14:00 น.)">รอบบ่าย (ก่อน 14:00 น.)</option>
                <option value="รอบเย็น (ก่อน 17:00 น.)">รอบเย็น (ก่อน 17:00 น.)</option>
            </select>
        </div>

        <div class="form-group">
            <label>3. ลงวันที่ทำความสะอาด</label>
            <input type="date" id="date" required>
        </div>

        <div class="form-group">
            <label>4. ลงชื่อผู้ทำความสะอาด</label>
            <input type="text" id="cleaner" placeholder="กรอกชื่อ - นามสกุล" required>
        </div>

        <div class="form-group">
            <label>5. แนบรูปถ่ายหน้างาน (ไม่เกิน 5MB)</label>
            <!-- นำคำสั่งบังคับกล้องออกแล้ว เพื่อให้เลือกรูปจากเครื่องได้ -->
            <input type="file" id="image" accept="image/*" required>
        </div>

        <button type="submit" id="submitBtn">บันทึกข้อมูล</button>
    </form>

    <a href="inspector.html" class="inspector-link">🔒 สำหรับผู้ตรวจสอบ (Inspector)</a>
</div>

<script>
    // ตั้งค่าช่องวันที่ให้เป็น "วันนี้" อัตโนมัติ
    document.getElementById('date').valueAsDate = new Date();

    // URL สำหรับส่งข้อมูลไป Google Apps Script
    const WEB_APP_URL = 'https://script.google.com/macros/s/AKfycbzDFJea1nQT2xDkpRgW2BeGTgq2e5xippBD4x6IYapR2YrUOzmO5fqXRq9JVIClK57G/exec';
    
    const form = document.getElementById('myForm');
    const submitBtn = document.getElementById('submitBtn');

    // ฟังก์ชันบีบอัดรูปภาพให้เล็กลงก่อนส่ง (แก้ปัญหามือถืออัปโหลดไม่ผ่าน)
    function compressImage(file, maxWidth, maxHeight, quality) {
        return new Promise((resolve, reject) => {
            const reader = new FileReader();
            reader.readAsDataURL(file);
            reader.onload = event => {
                const img = new Image();
                img.src = event.target.result;
                img.onload = () => {
                    let width = img.width;
                    let height = img.height;

                    if (width > height) {
                        if (width > maxWidth) {
                            height = Math.round(height * maxWidth / width);
                            width = maxWidth;
                        }
                    } else {
                        if (height > maxHeight) {
                            width = Math.round(width * maxHeight / height);
                            height = maxHeight;
                        }
                    }

                    const canvas = document.createElement('canvas');
                    canvas.width = width;
                    canvas.height = height;
                    const ctx = canvas.getContext('2d');
                    ctx.drawImage(img, 0, 0, width, height);

                    resolve(canvas.toDataURL('image/jpeg', quality));
                };
            };
            reader.onerror = error => reject(error);
        });
    }

    form.addEventListener('submit', async (e) => {
        e.preventDefault();
        
        const shop = document.getElementById('shop').value;
        const shift = document.getElementById('shift').value;
        const date = document.getElementById('date').value;
        const cleaner = document.getElementById('cleaner').value;
        const fileInput = document.getElementById('image');
        
        if (!fileInput.files || fileInput.files.length === 0) {
            alert('⚠️ กรุณาแนบรูปถ่ายหน้างานครับ');
            return;
        }

        const file = fileInput.files[0];
        
        // ป้องกันการกดปุ่มเบิ้ล
        submitBtn.innerText = '⏳ กำลังบีบอัดรูปและบันทึกข้อมูล...';
        submitBtn.disabled = true;

        try {
            // สั่งบีบอัดรูปภาพ
            const compressedBase64 = await compressImage(file, 1024, 1024, 0.7);

            const payload = {
                action: 'insert',
                shop: shop,
                shift: shift,
                date: date,
                cleaner: cleaner,
                image: compressedBase64 
            };

            const response = await fetch(WEB_APP_URL, {
                method: 'POST',
                body: JSON.stringify(payload)
            });

            const result = await response.json();
            
            if (result.status === 'success') {
                alert('✅ บันทึกข้อมูลและแนบรูปภาพเรียบร้อยแล้ว!');
                form.reset();
                document.getElementById('date').valueAsDate = new Date();
            } else {
                alert('❌ เกิดข้อผิดพลาดจากเซิร์ฟเวอร์: ' + result.message);
            }

        } catch (error) {
            alert('❌ เกิดข้อผิดพลาดในการเชื่อมต่อ กรุณาลองใหม่อีกครั้งครับ');
            console.error(error);
        } finally {
            submitBtn.innerText = 'บันทึกข้อมูล';
            submitBtn.disabled = false;
        }
    });
</script>
</body>
</html>
