<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>บันทึกการทำความสะอาดบ่อน้ำเสีย</title>
    <link href="https://fonts.googleapis.com/css2?family=Prompt:wght@300;400;500;600&display=swap" rel="stylesheet">
    <style>
        /* CSS เดิม */
        :root { --primary-color: #2563eb; --primary-hover: #1d4ed8; --bg-color: #f3f4f6; --form-bg: #ffffff; --text-main: #1f2937; --border-color: #d1d5db; }
        body { font-family: 'Prompt', sans-serif; background-color: var(--bg-color); margin: 0; padding: 20px; display: flex; justify-content: center; align-items: center; min-height: 100vh; flex-direction: column;}
        .container { width: 100%; max-width: 480px; background: var(--form-bg); padding: 30px; border-radius: 16px; box-shadow: 0 10px 25px rgba(0,0,0,0.05); }
        .header-title { text-align: center; color: var(--primary-color); margin-top: 0; margin-bottom: 25px; font-weight: 600; font-size: 24px; }
        .form-group { margin-bottom: 18px; }
        label { display: block; margin-bottom: 6px; font-weight: 500; color: var(--text-main); font-size: 14px; }
        select, input[type="text"], input[type="date"], input[type="file"] { width: 100%; padding: 12px 14px; border: 1.5px solid var(--border-color); border-radius: 8px; box-sizing: border-box; font-size: 15px; font-family: 'Prompt', sans-serif; background-color: #f9fafb; }
        select:focus, input[type="text"]:focus, input[type="date"]:focus { outline: none; border-color: var(--primary-color); background-color: #ffffff; }
        .image-preview-container { margin-top: 10px; width: 100%; border-radius: 8px; overflow: hidden; display: none; border: 1px solid var(--border-color); }
        .image-preview-container img { width: 100%; height: auto; display: block; object-fit: cover; }
        button { width: 100%; padding: 14px; margin-top: 15px; background-color: var(--primary-color); color: white; border: none; border-radius: 8px; font-size: 16px; font-weight: 600; font-family: 'Prompt', sans-serif; cursor: pointer; transition: all 0.3s; }
        button:hover { background-color: var(--primary-hover); }
        button:disabled { background-color: #93c5fd; cursor: not-allowed; }
        .admin-link { margin-top: 20px; text-align: center; }
        .admin-link a { color: var(--text-muted); text-decoration: none; font-size: 14px; }
        .admin-link a:hover { color: var(--primary-color); text-decoration: underline; }
    </style>
</head>
<body>

<div class="container">
    <h2 class="header-title">บันทึกทำความสะอาดบ่อน้ำเสีย</h2>
    <form id="cleanForm">
        
        <div class="form-group">
            <label>1. ร้านอาหาร</label>
            <select id="shop" required>
                <option value="">-- เลือกร้านค้า --</option>
                <option value="ร้านที่ 1">ร้านที่ 1</option>
                <option value="ร้านที่ 2">ร้านที่ 2</option>
                <option value="ร้านที่ 3">ร้านที่ 3</option>
                <option value="ร้านที่ 4">ร้านที่ 4</option>
                <option value="ร้านที่ 5">ร้านที่ 5</option>
            </select>
        </div>

        <div class="form-group">
            <label>2. รอบการทำความสะอาด</label>
            <select id="shift" required>
                <option value="">-- เลือกรอบ --</option>
                <option value="รอบเช้า (ก่อน 11:00 น.)">รอบเช้า (ก่อน 11:00 น.)</option>
                <option value="รอบบ่าย (ก่อน 14.00 น.)">รอบบ่าย (ก่อน 14.00 น.)</option>
            </select>
        </div>

        <div class="form-group">
            <label>3. ลงวันที่ทำความสะอาด</label>
            <input type="date" id="date" required>
        </div>

        <div class="form-group">
            <label>4. ลงชื่อผู้ทำความสะอาด</label>
            <input type="text" id="cleaner" placeholder="กรอกชื่อ - นามสกุล" required>
        </div>

        <div class="form-group">
            <label>5. แนบรูปถ่ายหน้างาน (ไม่เกิน 5MB)</label>
            <input type="file" id="image" accept="image/*" required>
            
            <div class="image-preview-container" id="previewContainer">
                <img id="imagePreview" src="" alt="ภาพตัวอย่าง">
            </div>
        </div>

        <button type="submit" id="submitBtn">บันทึกข้อมูล</button>
    </form>
</div>

<!-- ลิงก์สำหรับไปหน้าผู้ตรวจ -->
<div class="admin-link">
    <a href="inspector.html">🔒 สำหรับผู้ตรวจสอบ (Inspector)</a>
</div>

<script>
    const WEB_APP_URL = 'https://script.google.com/macros/s/AKfycbxQavnvwkqhUdi8YNPclcCNp58yQrLAh50udA-PPqStM0KM4v5sF42XwLHDXF5Xeb-x/exec';

    

    const form = document.getElementById('cleanForm');
    const photoInput = document.getElementById('photo');
    const previewContainer = document.getElementById('previewContainer');
    const imagePreview = document.getElementById('imagePreview');
    
    document.getElementById('date').valueAsDate = new Date();

    photoInput.addEventListener('change', function() {
        const file = this.files[0];
        if (file) {
            const reader = new FileReader();
            reader.onload = function(e) {
                imagePreview.src = e.target.result;
                previewContainer.style.display = 'block';
            }
            reader.readAsDataURL(file);
        } else {
            previewContainer.style.display = 'none';
        }
    });

    form.addEventListener('submit', async (e) => {
        e.preventDefault();
        
        const submitBtn = document.getElementById('submitBtn');
        submitBtn.innerText = '⏳ กำลังอัปโหลดและบันทึกข้อมูล...';
        submitBtn.disabled = true;

        const fileInput = document.getElementById('photo');
        const file = fileInput.files[0];
        
        if (file.size > 5242880) { 
            alert('❌ ขนาดไฟล์รูปภาพใหญ่เกินไป (กรุณาใช้ไฟล์ขนาดไม่เกิน 5MB)');
            submitBtn.innerText = 'บันทึกข้อมูล';
            submitBtn.disabled = false;
            return;
        }

        const reader = new FileReader();
        reader.onloadend = async () => {
            const base64Image = reader.result;
            
            const payload = {
                action: 'insert', // แจ้งหลังบ้านว่านี่คือการเพิ่มข้อมูลใหม่
                shop: document.getElementById('shop').value,
                shift: document.getElementById('shift').value,
                date: document.getElementById('date').value,
                cleaner: document.getElementById('cleaner').value,
                image: base64Image
            };

            try {
                await fetch(WEB_APP_URL, {
                    method: 'POST',
                    body: JSON.stringify(payload)
                });
                
                alert('✅ บันทึกข้อมูลและอัปโหลดรูปภาพเรียบร้อยแล้ว!');
                form.reset();
                document.getElementById('date').valueAsDate = new Date(); 
                previewContainer.style.display = 'none'; 
                
            } catch (err) {
                alert('❌ เกิดข้อผิดพลาดในการเชื่อมต่อ');
                console.error(err);
            } finally {
                submitBtn.innerText = 'บันทึกข้อมูล';
                submitBtn.disabled = false;
            }
        };
        
        reader.readAsDataURL(file);
    });
</script>
</body>
</html>
