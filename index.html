<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>บันทึกการทำความสะอาดบ่อไขมัน</title>
    <link href="https://fonts.googleapis.com/css2?family=Prompt:wght@300;400;500;600&display=swap" rel="stylesheet">
    <style>
        /* CSS เดิม */
        :root { --primary-color: #2563eb; --primary-hover: #1d4ed8; --bg-color: #f3f4f6; --form-bg: #ffffff; --text-main: #1f2937; --border-color: #d1d5db; }
        body { font-family: 'Prompt', sans-serif; background-color: var(--bg-color); margin: 0; padding: 20px; display: flex; justify-content: center; align-items: center; min-height: 100vh; flex-direction: column;}
        .container { width: 100%; max-width: 480px; background: var(--form-bg); padding: 30px; border-radius: 16px; box-shadow: 0 10px 25px rgba(0,0,0,0.05); }
        .header-title { text-align: center; color: var(--primary-color); margin-top: 0; margin-bottom: 25px; font-weight: 600; font-size: 24px; }
        .form-group { margin-bottom: 18px; }
        label { display: block; margin-bottom: 6px; font-weight: 500; color: var(--text-main); font-size: 14px; }
        select, input[type="text"], input[type="date"], input[type="file"] { width: 100%; padding: 12px 14px; border: 1.5px solid var(--border-color); border-radius: 8px; box-sizing: border-box; font-size: 15px; font-family: 'Prompt', sans-serif; background-color: #f9fafb; }
        select:focus, input[type="text"]:focus, input[type="date"]:focus { outline: none; border-color: var(--primary-color); background-color: #ffffff; }
        .image-preview-container { margin-top: 10px; width: 100%; border-radius: 8px; overflow: hidden; display: none; border: 1px solid var(--border-color); }
        .image-preview-container img { width: 100%; height: auto; display: block; object-fit: cover; }
        button { width: 100%; padding: 14px; margin-top: 15px; background-color: var(--primary-color); color: white; border: none; border-radius: 8px; font-size: 16px; font-weight: 600; font-family: 'Prompt', sans-serif; cursor: pointer; transition: all 0.3s; }
        button:hover { background-color: var(--primary-hover); }
        button:disabled { background-color: #93c5fd; cursor: not-allowed; }
        .admin-link { margin-top: 20px; text-align: center; }
        .admin-link a { color: var(--text-muted); text-decoration: none; font-size: 14px; }
        .admin-link a:hover { color: var(--primary-color); text-decoration: underline; }
    </style>
</head>
<body>

<div class="container">
    <h2 class="header-title">บันทึกทำความสะอาดบ่อไขมัน</h2>
    <form id="cleanForm">
        
        <div class="form-group">
            <label>1. ร้านอาหาร</label>
            <select id="shop" required>
                <option value="">-- เลือกร้านค้า --</option>
                <option value="ร้านที่ 1">ร้านที่ 1</option>
                <option value="ร้านที่ 2">ร้านที่ 2</option>
                <option value="ร้านที่ 3">ร้านที่ 3</option>
                <option value="ร้านที่ 4">ร้านที่ 4</option>
                <option value="ร้านที่ 5">ร้านที่ 5</option>
            </select>
        </div>

        <div class="form-group">
            <label>2. รอบการทำความสะอาด</label>
            <select id="shift" required>
                <option value="">-- เลือกรอบ --</option>
                <option value="รอบเช้า (ก่อน 11:00 น.)">รอบเช้า (ก่อน 11:00 น.)</option>
                <option value="รอบบ่าย (ก่อน 14.00 น.)">รอบบ่าย (ก่อน 14.00 น.)</option>
            </select>
        </div>

        <div class="form-group">
            <label>3. ลงวันที่ทำความสะอาด</label>
            <input type="date" id="date" required>
        </div>

        <div class="form-group">
            <label>4. ลงชื่อผู้ทำความสะอาด</label>
            <input type="text" id="cleaner" placeholder="กรอกชื่อ - นามสกุล" required>
        </div>

        <div class="form-group">
            <label>5. แนบรูปถ่ายหน้างาน (ไม่เกิน 5MB)</label>
            <input type="file" id="image" accept="image/*" required>
            
            <div class="image-preview-container" id="previewContainer">
                <img id="imagePreview" src="" alt="ภาพตัวอย่าง">
            </div>
        </div>

        <button type="submit" id="submitBtn">บันทึกข้อมูล</button>
    </form>
</div>

<!-- ลิงก์สำหรับไปหน้าผู้ตรวจ -->
<div class="admin-link">
    <a href="inspector.html">🔒 สำหรับผู้ตรวจสอบ (Inspector)</a>
</div>

<script>
    const WEB_APP_URL = 'https://script.google.com/macros/s/AKfycbzDFJea1nQT2xDkpRgW2BeGTgq2e5xippBD4x6IYapR2YrUOzmO5fqXRq9JVIClK57G/exec'; // ตรวจสอบให้แน่ใจว่าเป็น URL เวอร์ชันล่าสุด
    const form = document.getElementById('myForm'); // สมมติว่า form ของคุณใช้ id="myForm" (ปรับชื่อให้ตรงกับของคุณได้ครับ)
    const submitBtn = document.getElementById('submitBtn'); // สมมติว่าปุ่ม submit ของคุณใช้ id="submitBtn"

    // 🌟 ฟังก์ชันพิเศษ: บีบอัดรูปภาพก่อนส่ง (แก้ปัญหาอัปโหลดรูปจากมือถือไม่ผ่าน)
    function compressImage(file, maxWidth, maxHeight, quality) {
        return new Promise((resolve, reject) => {
            const reader = new FileReader();
            reader.readAsDataURL(file);
            reader.onload = event => {
                const img = new Image();
                img.src = event.target.result;
                img.onload = () => {
                    let width = img.width;
                    let height = img.height;

                    // คำนวณขนาดใหม่ให้สมส่วน
                    if (width > height) {
                        if (width > maxWidth) {
                            height = Math.round(height * maxWidth / width);
                            width = maxWidth;
                        }
                    } else {
                        if (height > maxHeight) {
                            width = Math.round(width * maxHeight / height);
                            height = maxHeight;
                        }
                    }

                    const canvas = document.createElement('canvas');
                    canvas.width = width;
                    canvas.height = height;
                    const ctx = canvas.getContext('2d');
                    ctx.drawImage(img, 0, 0, width, height);

                    // แปลงกลับเป็น Base64 แบบบีบอัดแล้ว (เป็น JPEG)
                    resolve(canvas.toDataURL('image/jpeg', quality));
                };
            };
            reader.onerror = error => reject(error);
        });
    }

    form.addEventListener('submit', async (e) => {
        e.preventDefault();
        
        const shop = document.getElementById('shop').value; // รหัสอ้างอิงร้านอาหาร
        const shift = document.getElementById('shift').value; // รอบทำความสะอาด
        const date = document.getElementById('date').value; // วันที่
        const cleaner = document.getElementById('cleaner').value; // ชื่อพนักงาน
        const fileInput = document.getElementById('image'); // ช่องอัปโหลดรูป
        
        if (!fileInput.files || fileInput.files.length === 0) {
            alert('⚠️ กรุณาแนบรูปถ่ายหน้างานครับ');
            return;
        }

        const file = fileInput.files[0];
        
        // เปลี่ยนสถานะปุ่มเพื่อกันคนกดเบิ้ล
        submitBtn.innerText = '⏳ กำลังบีบอัดรูปและบันทึกข้อมูล...';
        submitBtn.disabled = true;

        try {
            // บีบอัดรูปให้ความกว้าง/สูง ไม่เกิน 1024px และคุณภาพ 70% (ไฟล์จะเหลือประมาณ 100-300 KB)
            const compressedBase64 = await compressImage(file, 1024, 1024, 0.7);

            // เตรียมข้อมูลส่งไปที่ Google Apps Script
            const payload = {
                action: 'insert',
                shop: shop,
                shift: shift,
                date: date,
                cleaner: cleaner,
                image: compressedBase64 
            };

            // ส่งข้อมูล
            const response = await fetch(WEB_APP_URL, {
                method: 'POST',
                body: JSON.stringify(payload)
            });

            const result = await response.json();
            
            if (result.status === 'success') {
                alert('✅ บันทึกข้อมูลและแนบรูปภาพเรียบร้อยแล้ว!');
                form.reset(); // ล้างฟอร์ม
                document.getElementById('date').valueAsDate = new Date(); // รีเซ็ตวันที่กลับมาเป็นวันนี้
            } else {
                alert('❌ เกิดข้อผิดพลาดจากเซิร์ฟเวอร์: ' + result.message);
            }

        } catch (error) {
            alert('❌ เกิดข้อผิดพลาดในการเชื่อมต่อ กรุณาลองใหม่อีกครั้งครับ');
            console.error(error);
        } finally {
            // คืนค่าปุ่มกลับมาเหมือนเดิม
            submitBtn.innerText = 'บันทึกข้อมูล';
            submitBtn.disabled = false;
        }
    });
</script>


</body>
</html>
