<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ระบบตรวจสอบ - บ่อน้ำเสีย</title>
    <link href="https://fonts.googleapis.com/css2?family=Prompt:wght@300;400;500;600&display=swap" rel="stylesheet">
    <style>
        :root { --primary-color: #2563eb; --success-color: #10b981; --bg-color: #f3f4f6; --card-bg: #ffffff; --text-main: #1f2937; }
        body { font-family: 'Prompt', sans-serif; background-color: var(--bg-color); margin: 0; padding: 20px; }
        .header { max-width: 800px; margin: 0 auto 20px auto; text-align: center; }
        .header h2 { color: var(--primary-color); }
        .back-link { display: inline-block; margin-bottom: 20px; color: var(--text-main); text-decoration: none; background: #e5e7eb; padding: 8px 16px; border-radius: 8px;}
        
        #loading { text-align: center; margin-top: 50px; color: #6b7280; }
        
        .grid-container { max-width: 800px; margin: auto; display: grid; grid-template-columns: 1fr; gap: 20px; }
        .card { background: var(--card-bg); padding: 20px; border-radius: 12px; box-shadow: 0 4px 6px rgba(0,0,0,0.05); border-left: 5px solid #fbbf24; }
        .card.approved { border-left-color: var(--success-color); opacity: 0.8; }
        
        .card-header { display: flex; justify-content: space-between; border-bottom: 1px solid #e5e7eb; padding-bottom: 10px; margin-bottom: 15px; }
        .card-title { font-weight: 600; font-size: 18px; }
        .card-date { color: #6b7280; font-size: 14px; }
        .info-row { margin-bottom: 8px; font-size: 15px; }
        
        .photo-btn { display: inline-block; margin-top: 10px; padding: 8px 16px; background-color: #f3f4f6; color: var(--text-main); border: 1px solid #d1d5db; border-radius: 6px; text-decoration: none; font-size: 14px; transition: 0.2s; }
        .photo-btn:hover { background-color: #e5e7eb; }
        
        .action-area { margin-top: 20px; padding-top: 15px; border-top: 1px dashed #e5e7eb; }
        .action-area select { padding: 10px; border-radius: 6px; border: 1px solid #d1d5db; font-family: 'Prompt'; margin-right: 10px; width: 60%; max-width: 200px;}
        .approve-btn { padding: 10px 20px; background-color: var(--success-color); color: white; border: none; border-radius: 6px; font-family: 'Prompt'; cursor: pointer; transition: 0.2s; }
        .approve-btn:hover { background-color: #059669; }
        
        .approved-text { color: var(--success-color); font-weight: 600; display: flex; align-items: center; }
    </style>
</head>
<body>

<div class="header">
    <a href="index.html" class="back-link">⬅ กลับไปหน้าลงบันทึก</a>
    <h2>รายการรอตรวจสอบ</h2>
    <p>ระบบดึงข้อมูลล่าสุดจาก Google Sheet</p>
</div>

<div id="loading">⏳ กำลังโหลดข้อมูล...</div>
<div class="grid-container" id="recordsContainer"></div>

<script>
    const WEB_APP_URL = 'https://script.google.com/macros/s/AKfycbzDFJea1nQT2xDkpRgW2BeGTgq2e5xippBD4x6IYapR2YrUOzmO5fqXRq9JVIClK57G/exec';

    // ดึงข้อมูลเมื่อเปิดหน้าเว็บ
    window.onload = async () => {
        try {
            const response = await fetch(WEB_APP_URL, {
                method: 'POST',
                body: JSON.stringify({ action: 'get_records' })
            });
            const result = await response.json();
            
            document.getElementById('loading').style.display = 'none';
            renderRecords(result.data);
            
        } catch (error) {
            document.getElementById('loading').innerText = '❌ ไม่สามารถโหลดข้อมูลได้';
            console.error(error);
        }
    };

    function renderRecords(records) {
        const container = document.getElementById('recordsContainer');
        container.innerHTML = '';

        if(records.length === 0) {
            container.innerHTML = '<div style="text-align:center;">ไม่มีข้อมูล</div>';
            return;
        }

        records.forEach(record => {
            // เช็คว่าตรวจหรือยัง
            const isApproved = record.inspector && record.inspector.trim() !== '';
            
            // แปลงรูปแบบวันที่ให้อ่านง่าย
            let dateStr = record.date;
            try {
                const d = new Date(record.date);
                if(!isNaN(d)) dateStr = d.toLocaleDateString('th-TH', { year: 'numeric', month: 'long', day: 'numeric' });
            } catch(e) {}

            let actionHtml = '';
            if(isApproved) {
                actionHtml = `<div class="approved-text">✅ ตรวจสอบแล้วโดย: ${record.inspector}</div>`;
            } else {
                actionHtml = `
                    <select id="select_${record.row}">
                        <option value="">-- เลือกชื่อผู้ตรวจ --</option>
                        <option value="Jantima S.">Jantima S.</option>
                        <option value="Thanat Y.">Thanat Y.</option>
                    </select>
                    <button class="approve-btn" onclick="approveRecord(${record.row})">บันทึกรับทราบ</button>
                `;
            }

            const cardHtml = `
                <div class="card ${isApproved ? 'approved' : ''}" id="card_${record.row}">
                    <div class="card-header">
                        <div class="card-title">${record.shop}</div>
                        <div class="card-date">${dateStr}</div>
                    </div>
                    <div class="info-row"><strong>รอบ:</strong> ${record.shift}</div>
                    <div class="info-row"><strong>ผู้ทำความสะอาด:</strong> ${record.cleaner}</div>
                    <a href="${record.image}" target="_blank" class="photo-btn">📸 คลิกดูรูปถ่ายหน้างาน</a>
                    
                    <div class="action-area" id="actionArea_${record.row}">
                        ${actionHtml}
                    </div>
                </div>
            `;
            container.insertAdjacentHTML('beforeend', cardHtml);
        });
    }

    async function approveRecord(rowNumber) {
        const selectBox = document.getElementById(`select_${rowNumber}`);
        const inspectorName = selectBox.value;

        if(!inspectorName) {
            alert('กรุณาเลือกชื่อผู้ตรวจก่อนกดยืนยัน');
            return;
        }

        const btn = selectBox.nextElementSibling;
        btn.innerText = 'กำลังบันทึก...';
        btn.disabled = true;

        try {
            await fetch(WEB_APP_URL, {
                method: 'POST',
                body: JSON.stringify({ 
                    action: 'update_inspector',
                    row: rowNumber,
                    inspector: inspectorName
                })
            });
            
            // อัปเดต UI เมื่อสำเร็จ
            document.getElementById(`actionArea_${rowNumber}`).innerHTML = `<div class="approved-text">✅ ตรวจสอบแล้วโดย: ${inspectorName}</div>`;
            document.getElementById(`card_${rowNumber}`).classList.add('approved');
            
        } catch (error) {
            alert('❌ เกิดข้อผิดพลาด ไม่สามารถบันทึกข้อมูลได้');
            btn.innerText = 'บันทึกรับทราบ';
            btn.disabled = false;
        }
    }
</script>
</body>
</html>
