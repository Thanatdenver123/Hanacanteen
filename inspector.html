<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ระบบตรวจสอบ - บ่อน้ำเสีย</title>
    <link href="https://fonts.googleapis.com/css2?family=Prompt:wght@300;400;500;600&display=swap" rel="stylesheet">
    <style>
        :root { --primary-color: #2563eb; --success-color: #10b981; --bg-color: #f3f4f6; --card-bg: #ffffff; --text-main: #1f2937; }
        body { font-family: 'Prompt', sans-serif; background-color: var(--bg-color); margin: 0; padding: 20px; }
        .header { max-width: 800px; margin: 0 auto 20px auto; text-align: center; }
        .header h2 { color: var(--primary-color); }
        .back-link { display: inline-block; margin-bottom: 20px; color: var(--text-main); text-decoration: none; background: #e5e7eb; padding: 8px 16px; border-radius: 8px;}
        .back-link:hover { background: #d1d5db; }
        
        #loading { text-align: center; margin-top: 50px; color: #6b7280; font-size: 16px; }
        
        .grid-container { max-width: 800px; margin: auto; display: grid; grid-template-columns: 1fr; gap: 20px; }
        .card { background: var(--card-bg); padding: 20px; border-radius: 12px; box-shadow: 0 4px 6px rgba(0,0,0,0.05); border-left: 5px solid #fbbf24; }
        .card.approved { border-left-color: var(--success-color); opacity: 0.85; }
        
        .card-header { display: flex; justify-content: space-between; align-items: center; border-bottom: 1px solid #e5e7eb; padding-bottom: 12px; margin-bottom: 15px; }
        .card-title { font-weight: 600; font-size: 18px; color: var(--primary-color); }
        .card-time { color: #6b7280; font-size: 13px; background: #f3f4f6; padding: 4px 8px; border-radius: 4px; }
        
        .info-row { margin-bottom: 8px; font-size: 15px; }
        .info-label { font-weight: 500; color: #4b5563; display: inline-block; width: 160px; }
        
        .photo-btn { display: inline-block; margin-top: 15px; padding: 8px 16px; background-color: #f3f4f6; color: var(--text-main); border: 1px solid #d1d5db; border-radius: 6px; text-decoration: none; font-size: 14px; transition: 0.2s; font-weight: 500; }
        .photo-btn:hover { background-color: #e5e7eb; }
        
        .action-area { margin-top: 20px; padding-top: 15px; border-top: 1px dashed #e5e7eb; display: flex; align-items: center; gap: 10px; flex-wrap: wrap; }
        .action-area select { padding: 10px; border-radius: 6px; border: 1px solid #d1d5db; font-family: 'Prompt'; flex-grow: 1; max-width: 250px; font-size: 14px; }
        .approve-btn { padding: 10px 20px; background-color: var(--success-color); color: white; border: none; border-radius: 6px; font-family: 'Prompt'; cursor: pointer; transition: 0.2s; font-weight: 500; white-space: nowrap; }
        .approve-btn:hover { background-color: #059669; }
        
        .approved-text { color: var(--success-color); font-weight: 600; display: flex; align-items: center; gap: 8px; }
    </style>
</head>
<body>

<div class="header">
    <a href="index.html" class="back-link">⬅ กลับไปหน้าลงบันทึก</a>
    <h2>รายการรอตรวจสอบ</h2>
    <p>ระบบดึงข้อมูลล่าสุดจาก Google Sheet</p>
</div>

<div id="loading">⏳ กำลังโหลดข้อมูล...</div>
<div class="grid-container" id="recordsContainer"></div>

<script>
    const WEB_APP_URL = 'https://script.google.com/macros/s/AKfycbzDFJea1nQT2xDkpRgW2BeGTgq2e5xippBD4x6IYapR2YrUOzmO5fqXRq9JVIClK57G/exec';

    // ดึงข้อมูลเมื่อเปิดหน้าเว็บ
    window.onload = async () => {
        try {
            const response = await fetch(WEB_APP_URL, {
                method: 'POST',
                body: JSON.stringify({ action: 'get_records' })
            });
            const result = await response.json();
            
            document.getElementById('loading').style.display = 'none';
            renderRecords(result.data);
            
        } catch (error) {
            document.getElementById('loading').innerText = '❌ ไม่สามารถโหลดข้อมูลได้ (ตรวจสอบการเชื่อมต่ออินเทอร์เน็ต)';
            console.error(error);
        }
    };

    function renderRecords(records) {
        const container = document.getElementById('recordsContainer');
        container.innerHTML = '';

        // ข้ามแถวที่ว่างเปล่า หรือแถวที่ไม่มีข้อมูลร้านค้า
        const validRecords = records.filter(record => record.shop && record.shop.trim() !== '');

        if(validRecords.length === 0) {
            container.innerHTML = '<div style="text-align:center; color: #6b7280; margin-top: 20px;">ไม่มีข้อมูลรอตรวจสอบ</div>';
            return;
        }

        validRecords.forEach(record => {
            const isApproved = record.inspector && record.inspector.trim() !== '';
            
            // แปลงรูปแบบวันที่ประทับเวลา (Timestamp) ให้อ่านง่าย
            let timeStr = record.timestamp;
            try {
                const t = new Date(record.timestamp);
                if(!isNaN(t)) timeStr = t.toLocaleString('th-TH', { year: 'numeric', month: 'short', day: 'numeric', hour: '2-digit', minute: '2-digit' }) + ' น.';
            } catch(e) {}

            // แปลงรูปแบบวันที่ลงมือทำความสะอาด ให้อ่านง่าย
            let dateStr = record.date;
            try {
                const d = new Date(record.date);
                if(!isNaN(d)) dateStr = d.toLocaleDateString('th-TH', { year: 'numeric', month: 'long', day: 'numeric' });
            } catch(e) {}

            let actionHtml = '';
            if(isApproved) {
                actionHtml = `<div class="approved-text">✅ ตรวจสอบแล้วโดย : ${record.inspector}</div>`;
            } else {
                actionHtml = `
                    <select id="select_${record.row}">
                        <option value="">-- เลือกชื่อผู้ตรวจ --</option>
                        <option value="Jantima S.">Jantima S.</option>
                        <option value="Thanat Y.">Thanat Y.</option>
                    </select>
                    <button class="approve-btn" onclick="approveRecord(${record.row})">บันทึกรับทราบ</button>
                `;
            }

            const cardHtml = `
                <div class="card ${isApproved ? 'approved' : ''}" id="card_${record.row}">
                    <div class="card-header">
                        <div class="card-title">🏢 ${record.shop}</div>
                        <div class="card-time">🕒 ประทับเวลา: ${timeStr}</div>
                    </div>
                    <div class="info-row"><span class="info-label">รอบการทำความสะอาด:</span> ${record.shift}</div>
                    <div class="info-row"><span class="info-label">ลงวันที่ทำความสะอาด:</span> ${dateStr}</div>
                    <div class="info-row"><span class="info-label">ลงชื่อผู้ทำความสะอาด:</span> ${record.cleaner}</div>
                    
                    <a href="${record.image}" target="_blank" class="photo-btn">📸 กดดูรูปถ่ายหน้างาน</a>
                    
                    <div class="action-area" id="actionArea_${record.row}">
                        ${actionHtml}
                    </div>
                </div>
            `;
            container.insertAdjacentHTML('beforeend', cardHtml);
        });
    }

    async function approveRecord(rowNumber) {
        const selectBox = document.getElementById(`select_${rowNumber}`);
        const inspectorName = selectBox.value;

        if(!inspectorName) {
            alert('⚠️ กรุณาเลือกชื่อผู้ตรวจก่อนกดยืนยันครับ');
            return;
        }

        const btn = selectBox.nextElementSibling;
        btn.innerText = 'กำลังบันทึก...';
        btn.disabled = true;

        try {
            await fetch(WEB_APP_URL, {
                method: 'POST',
                body: JSON.stringify({ 
                    action: 'update_inspector',
                    row: rowNumber,
                    inspector: inspectorName
                })
            });
            
            // อัปเดต UI ให้แสดงว่าตรวจแล้วทันที
            document.getElementById(`actionArea_${rowNumber}`).innerHTML = `<div class="approved-text">✅ ตรวจสอบแล้วโดย : ${inspectorName}</div>`;
            document.getElementById(`card_${rowNumber}`).classList.add('approved');
            
        } catch (error) {
            alert('❌ เกิดข้อผิดพลาด ไม่สามารถบันทึกข้อมูลได้ กรุณาลองใหม่อีกครั้ง');
            btn.innerText = 'บันทึกรับทราบ';
            btn.disabled = false;
        }
    }
</script>
</body>
</html>
